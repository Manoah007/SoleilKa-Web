<!DOCTYPE html>

<html lang="fr">


    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Association Soleil Ka</title>
        <link rel="stylesheet" href="static/css/style.css">
    </head>



    <body>
        <main id="inscription">
            <!-- FORMULAIRE D'ADHESION -->
            <section class="inscription-adh">
                <div class="grille-adhesion">
                    <h2>Devenez membre</h2>
                    <p>Rejoignez notre communauté et participez à nos activités culturelles !</p>
                    <hr class="separateur-titre">
                </div>
                
                <form action="#" method="POST" class="formulaire-adhesion" id="form-adh">

                    <input type="hidden" name="_next" value="https://www.helloasso.com/associations/soleil-ka/adhesions/TON_LIEN">

                    <div class="form-row-double">
                        <input type="text" id="nom" name="nom" placeholder="Votre nom complet *" required>
                        <input type="email" id="email" name="email" placeholder="Votre adresse e-mail *" required>
                        <input type="tel" id="telephone" name="telephone" placeholder="Votre téléphone (optionnel)">
                    </div>

                    </div>

                    <div class="form-rgpd">
                        <input type="checkbox" id="rgpd" name="rgpd" required>
                        <label for="rgpd">En soumettant ce formulaire, j'accepte que mes données soient exploitées dans le cadre de mon adhésion. *</label>
                    </div>

                    <button type="submit" class="btn btn-accent btn-full">Envoyer le formulaire d'adhésion</button>
                </form>
            </section>
        </main>

    </body>

</html>
